<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://i.postimg.cc/gk3fSryy/Icon.jpg" type="image/x-icon">
    <title>WHITE WOLF — Contributors</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg:      #0d0d0d;
            --surface: #141414;
            --border:  #2a2a2a;
            --text:    #d4d4d4;
            --muted:   #555;
            --white:   #f0f0f0;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            line-height: 1.6;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border);
        }

        .nav-logo {
            font-family: 'IBM Plex Mono', monospace;
            font-size: .85rem;
            color: var(--white);
            text-decoration: none;
            letter-spacing: .1em;
        }

        .btn {
            font-family: 'IBM Plex Mono', monospace;
            font-size: .75rem;
            padding: 8px 18px;
            border-radius: 4px;
            text-decoration: none;
            transition: opacity .15s;
            letter-spacing: .04em;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn:hover { opacity: .7; }

        .page-header {
            max-width: 900px;
            margin: 0 auto;
            padding: 56px 40px 40px;
        }

        .page-header h1 {
            font-family: 'IBM Plex Mono', monospace;
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 500;
            color: var(--white);
            letter-spacing: .06em;
            margin-bottom: 10px;
        }

        .page-header p {
            font-size: .88rem;
            color: var(--muted);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 40px 80px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-top: 8px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 20px 14px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: border-color .15s, opacity .15s;
            display: block;
        }

        .card:hover {
            border-color: #444;
            opacity: .85;
        }

        .card img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 1px solid var(--border);
            display: block;
            margin: 0 auto 12px;
        }

        .card .name {
            font-family: 'IBM Plex Mono', monospace;
            font-size: .78rem;
            color: var(--white);
            font-weight: 500;
            margin-bottom: 4px;
            word-break: break-all;
        }

        .card .contrib {
            font-family: 'IBM Plex Mono', monospace;
            font-size: .68rem;
            color: var(--muted);
        }

        .status {
            font-family: 'IBM Plex Mono', monospace;
            font-size: .8rem;
            color: var(--muted);
            padding: 40px 0;
        }

        footer {
            border-top: 1px solid var(--border);
            padding: 24px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        footer span {
            font-family: 'IBM Plex Mono', monospace;
            font-size: .7rem;
            color: var(--muted);
            letter-spacing: .05em;
        }

        @media (max-width: 600px) {
            nav, .page-header, .container, footer { padding-left: 20px; padding-right: 20px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-logo">WHITE WOLF</a>
        <a href="index.html" class="btn">← retour</a>
    </nav>

    <div class="page-header">
        <h1>contributors</h1>
        <p>Les gens qui ont participé au projet.</p>
    </div>

    <div class="container">
        <div class="grid" id="list">
            <p class="status">chargement…</p>
        </div>
    </div>

    <footer>
        <span>WHITE WOLF — open source</span>
        <span>MIT license</span>
    </footer>

    <script>
        async function loadContributors() {
            const list = document.getElementById("list");
            try {
                const res  = await fetch("https://api.github.com/repos/Python-loving/WHITEWOLF-TOOLS/contributors");
                const data = await res.json();

                list.innerHTML = '';

                data.forEach(user => {
                    const card = document.createElement("a");
                    card.href      = user.html_url;
                    card.target    = "_blank";
                    card.className = "card";
                    card.innerHTML = `
                        <img src="${user.avatar_url}" alt="${user.login}">
                        <div class="name">${user.login}</div>
                        <div class="contrib">${user.contributions} commits</div>
                    `;
                    list.appendChild(card);
                });
            } catch {
                list.innerHTML = '<p class="status">impossible de charger les contributeurs.</p>';
            }
        }

        loadContributors();
    </script>
</body>
</html>
